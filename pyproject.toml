[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lunar-lander-lab"
version = "1.0.0"
description = "A local reinforcement learning lab for LunarLander-v3 and reward shaping."
requires-python = ">=3.10"
dependencies = [
  "gymnasium[box2d]>=1.1,<2",
  "stable-baselines3>=2.6,<3",
  "torch>=2.8,<3",
  "numpy>=1.24,<3",
  "moviepy>=2.1,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
rocketlab = "rocketlab.cli:main"

[tool.setuptools.package-data]
rocketlab = ["web/*"]

[tool.setuptools.packages.find]
include = ["rocketlab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
